
  <script>
    const viewButtons = document.querySelectorAll("[data-view]");
    const homeLinks = document.querySelectorAll("[data-view-link='home']");
    const views = document.querySelectorAll(".view");
    const menu = document.querySelector(".mobile-menu");
    const menuScrim = document.querySelector(".menu-scrim");
    const menuButton = document.querySelector(".menu-button");
    const menuCloseButtons = document.querySelectorAll("[data-menu-close]");
    const outlines = document.querySelectorAll("[data-outline]");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let currentView = "home";
    let outlineUpdateQueued = false;
    function closeMenu() {
      menu.classList.remove("is-open");
      menuScrim.classList.remove("is-open");
      menu.setAttribute("aria-hidden", "true");
      menuButton.setAttribute("aria-expanded", "false");
    }
    function openMenu() {
      menu.classList.add("is-open");
      menuScrim.classList.add("is-open");
      menu.setAttribute("aria-hidden", "false");
      menuButton.setAttribute("aria-expanded", "true");
    }
    function showView(viewName) {
      currentView = viewName;
      views.forEach((view) => {
        view.classList.toggle("is-active", view.id === `view-${viewName}`);
      });
      viewButtons.forEach((button) => {
        const isCurrent = button.dataset.view === viewName;
        button.classList.toggle("is-active", isCurrent);
        button.setAttribute("aria-pressed", String(isCurrent));
      });
      outlines.forEach((outline) => {
        outline.hidden = outline.dataset.outline !== viewName;
      });
      document.title = viewName === "resume"
        ? "Resume | MD Rahman"
        : "MD Rahman | Mechanical Engineer";
      closeMenu();
      window.scrollTo({
        top: 0,
        behavior: reducedMotion ? "auto" : "smooth"
      });
      requestAnimationFrame(updateOutline);
    }
    function updateOutline() {
      const activeView = document.getElementById(`view-${currentView}`);
      const sections = [...activeView.querySelectorAll("[data-outline-section]")];
      const outline = document.querySelector(`[data-outline="${currentView}"]`);
      if (!sections.length || !outline) {
        return;
      }
      const activationLine = 170;
      const currentSection = sections.reduce((activeSection, section) => {
        return section.getBoundingClientRect().top <= activationLine
          ? section
          : activeSection;
      }, sections[0]);
      outline.querySelectorAll("[data-section-link]").forEach((link) => {
        const isCurrent = link.dataset.sectionLink === currentSection.id;
        link.classList.toggle("is-current", isCurrent);
        if (isCurrent) {
          link.setAttribute("aria-current", "location");
        } else {
          link.removeAttribute("aria-current");
        }
      });
    }
    function queueOutlineUpdate() {
      if (outlineUpdateQueued) {
        return;
      }
      outlineUpdateQueued = true;
      requestAnimationFrame(() => {
        updateOutline();
        outlineUpdateQueued = false;
      });
    }
    viewButtons.forEach((button) => {
      button.addEventListener("click", () => showView(button.dataset.view));
    });
    homeLinks.forEach((link) => {
      link.addEventListener("click", () => showView("home"));
    });
    menuButton.addEventListener("click", openMenu);
    menuCloseButtons.forEach((button) => button.addEventListener("click", closeMenu));
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeMenu();
      }
    });
    document.querySelectorAll("[data-print-resume]").forEach((button) => {
      button.addEventListener("click", () => window.print());
    });
    window.addEventListener("scroll", queueOutlineUpdate, { passive: true });
    window.addEventListener("resize", queueOutlineUpdate);
    updateOutline();
    const revealObserver = new IntersectionObserver(
      (entries, observer) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) {
            return;
          }
          entry.target.classList.add("is-visible");
          observer.unobserve(entry.target);
        });
      },
      {
        threshold: 0.12,
        rootMargin: "0px 0px -8% 0px"
      }
    );
    document.querySelectorAll(".reveal").forEach((element) => {
      if (reducedMotion) {
        element.classList.add("is-visible");
      } else {
        revealObserver.observe(element);
      }
    });
  </script>
</body>
</html>
